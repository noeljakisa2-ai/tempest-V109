<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEMPEST V109.7 CLOUD</title>
<style>
body{background:#0a0a0a;color:#FFD700;font-family:Arial;text-align:center;padding:20px}
.card{background:#111;border:1px solid #FFD70022;border-radius:20px;padding:20px;margin:15px 0}
.big{font-size:42px;font-weight:900}
.btn{padding:14px 28px;border-radius:30px;border:none;font-weight:900;font-size:16px}
.on{background:#FFD700;color:#000} .off{background:#333;color:#fff}
.trade{font-size:12px;text-align:left;border-bottom:1px solid #222;padding:8px}
</style>
</head>
<body>
<h2>🔥 TEMPEST V109.7 CLOUD</h2>
<div class="card">
<div style="font-size:10px;opacity:0.6">CLOUD ENGINE STATUS</div>
<div id="cloudDot">🟢 LIVE - Trading even when phone OFF</div>
<div class="big" id="bal">$10,000.00</div>
<div id="profit">Cloud Profit: $0.00</div><br>
<button class="btn on" id="toggleBtn" onclick="toggle()">☁️ CLOUD AUTO: ON</button>
</div>
<div class="card" id="trades">Loading cloud trades...</div>
<script>
let state=null;
async function load(){
 let r=await fetch('/api/status'); state=await r.json();
 document.getElementById('bal').innerText='$'+state.balance.toFixed(2);
 document.getElementById('profit').innerText='Cloud Profit: $'+state.profit.toFixed(2)+' | '+state.trades.length+' trades';
 document.getElementById('toggleBtn').innerText= state.isAuto ? '☁️ CLOUD AUTO: ON' : '💤 CLOUD AUTO: OFF';
 document.getElementById('toggleBtn').className='btn '+(state.isAuto?'on':'off');
 let h=''; state.trades.forEach(t=>{ h+=`<div class=trade>${t.t} | ${t.sig} @ ${t.price} | <b style=color:${t.p>0?'#0f0':'#f44'}>${t.p>0?'+':''}$${t.p}</b></div>` });
 document.getElementById('trades').innerHTML=h||'No trades yet - cloud will trade in 60 sec';
}
async function toggle(){ await fetch('/api/toggle'); load(); }
setInterval(load,3000); load();
</script>
</body>
</html>
