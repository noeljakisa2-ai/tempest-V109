<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TEMPEST V109.3 MISSIONS LIVE</title>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:monospace}
body{background:#060a14;color:#fff}
.top{padding:10px;background:#0a1225;display:flex;justify-content:space-between;border-bottom:2px solid #00f2ff}
.btn{padding:12px 18px;border:none;border-radius:12px;font-weight:900;margin:4px;cursor:pointer}
.buy{background:#00ff88}.sell{background:#ff0040;color:#fff}
.card{background:#0e1a33;border-radius:14px;padding:12px;margin:8px;border:1px solid #1a3a6a}
.mission{display:flex;justify-content:space-between;padding:10px 6px;border-bottom:1px solid #1a2a4a;cursor:pointer}
.mission:active{background:#1a2f5a}
.done{color:#00ff88}.xp{color:#ffdd00;font-weight:900}
#modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
.modalBox{background:#0e1a33;border:2px solid #00f2ff;border-radius:16px;padding:20px;width:100%;max-width:380px}
#chart{height:360px}
</style>
</head>
<body>
<div class="top"><div>🔥 V109.3 MISSIONS LIVE | Kampala 10:22 AM</div><div id="balTop">$10,000 LVL <span id="lvl">1</span> XP <span id="xp">0</span></div></div>
<div style="padding:8px"><button class="btn buy" onclick="doTrade('BUY')">BUY XAU</button><button class="btn sell" onclick="doTrade('SELL')">SELL XAU</button></div>
<div id="chart"></div>

<div class="card">
<h3>🎯 MISSION BOARD - 10 Missions (TAP TO OPEN)</h3>
<div id="missionList"></div>
</div>

<div id="modal" onclick="closeModal()"><div class="modalBox" onclick="event.stopPropagation()">
<h2 id="mTitle"></h2><p id="mDesc" style="margin:12px 0;line-height:1.5;font-size:13px"></p>
<div id="mProgress" style="background:#111;padding:8px;border-radius:8px;margin:8px 0"></div>
<button class="btn buy" style="width:100%" onclick="closeModal()">GOT IT - START MISSION</button>
</div></div>

<script>
let xp=0, trades=0, wins=0, profit=0, streak=0, bestStreak=0, noLossStreak=0, spins=0, journal=0;
let missions=[
{t:"Onboarding 3 trades",d:"Perfect for her solo start! Just click BUY or SELL 3 times. Learn buttons. No risk, virtual money.",goal:3,cur:()=>trades, xp:10},
{t:"Risk Master 5 trades 0.5%",d:"Titan IQ Mentor: Keep each trade to 0.5% risk. In practice, just do 5 trades - you're learning risk control.",goal:5,cur:()=>trades, xp:40},
{t:"Win Streak 3 wins",d:"Luna Mentor: Try to win 3 in a row. Follow trend - if chart going up, BUY. Going down, SELL.",goal:3,cur:()=>bestStreak, xp:100},
{t:"Titan IQ 120",d:"Titan IQ says: Pro traders never risk more than 1%. Do 7 trades with discipline to unlock.",goal:7,cur:()=>trades, xp:120},
{t:"Luna Trend 5",d:"Luna: Catch 5 trend trades. Watch chart for 10 sec, then trade WITH the trend.",goal:5,cur:()=>trades, xp:80},
{t:"Nova Profit $500",d:"Nova: Make $500 virtual profit. Balance goes from $10k to $10.5k. You can do it solo!",goal:500,cur:()=>Math.max(0,profit), xp:150},
{t:"Journal 10 trades",d:"Every BUY/SELL adds to journal. Do 10 trades to build habit of tracking.",goal:10,cur:()=>journal, xp:60},
{t:"No Loss Streak 5",d:"Try 5 trades without big loss. Even small wins count. Patience is key!",goal:5,cur:()=>noLossStreak, xp:200},
{t:"Spin Wheel 3x",d:"Tap SPIN button 3 times for bonus XP. Just for fun & motivation!",goal:3,cur:()=>spins, xp:30},
{t:"MEGA BOSS Profit $1000",d:"FINAL BOSS: Make $1000 profit total. From $10k to $11k. Unlocks MEGA NFT Badge!",goal:1000,cur:()=>Math.max(0,profit), xp:500}
];

new TradingView.widget({autosize:true,symbol:"OANDA:XAUUSD",interval:"1",timezone:"Africa/Kampala",theme:"dark",container_id:"chart"});

function render(){
 let html=missions.map((m,i)=>{
   let cur=m.cur(), g=m.goal, pct=Math.min(100,Math.floor(cur/g*100)), done=cur>=g;
   return `<div class="mission" onclick="openMission(${i})"><span>${done?'✅':''} ${i+1}. ${m.t} ${cur}/${g} ${pct}%</span><span class="${done?'done':'xp'}">${done?'DONE':'+'+m.xp+' XP'}</span></div>`;
 }).join('');
 document.getElementById('missionList').innerHTML=html;
 document.getElementById('xp').innerText=xp;
 document.getElementById('lvl').innerText=Math.floor(xp/100)+1;
}
function openMission(i){
 let m=missions[i]; document.getElementById('mTitle').innerText=(i+1)+". "+m.t;
 document.getElementById('mDesc').innerText=m.d;
 let cur=m.cur(); document.getElementById('mProgress').innerHTML=`Progress: ${cur}/${m.goal}<br><div style="background:#222;height:10px;border-radius:5px;margin-top:6px"><div style="width:${Math.min(100,cur/m.goal*100)}%;background:#00ff88;height:10px;border-radius:5px"></div></div><br>Reward: +${m.xp} XP`;
 document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none'}

function doTrade(type){
 trades++; journal++;
 let p=(Math.random()-0.42)*180; profit+=p;
 if(p>0){wins++; streak++; bestStreak=Math.max(bestStreak,streak); noLossStreak++;} else {streak=0; noLossStreak=0;}
 // check mission complete
 missions.forEach(m=>{ if(m.cur()>=m.goal &&!m.claimed){ xp+=m.xp; m.claimed=true; alert("🎉 MISSION COMPLETE: "+m.t+" +"+m.xp+" XP!"); }});
 render();
}
render();
</script>
</body>
</html>
